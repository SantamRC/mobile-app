name: iOS CI

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
      - develop

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS Debug
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: 3.44.0

      - name: Cache pub dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pub-cache
            **/.dart_tool
            **/.packages
            **/.flutter-plugins
            **/.flutter-plugin-dependencies
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Clean and Get Dependencies
        run: |
          flutter clean
          flutter pub get
          flutter gen-l10n
          flutter packages pub run build_runner build --delete-conflicting-outputs

      - name: Ensure CocoaPods
        run: sudo gem install cocoapods --no-document || true

      - name: Update CocoaPods Specs Repo
        run: |
          cd ios
          pod repo update
          cd ..

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install
          cd ..

      - name: List iOS Simulators
        run: xcrun simctl list devices

      - name: Build iOS Debug (No Code Signing)
        env:
          GH_OAUTH_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GH_OAUTH_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
        run: |
          flutter build ios --debug --no-codesign --simulator \
            --dart-define=GITHUB_OAUTH_CLIENT_ID=$GH_OAUTH_CLIENT_ID \
            --dart-define=GITHUB_OAUTH_CLIENT_SECRET=$GH_OAUTH_CLIENT_SECRET